name: Tests sin credenciales
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-operativo.txt pytest
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
